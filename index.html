<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css"/>
  <title>Calculator</title>
</head>
<body>
  <div id="main-container">
    <div id="display"></div>
    <div id="buttons">
      <div class="row">
        <button id="ac">AC</button>
        <button id="del">DEL</button>
        <button style="visibility: hidden;"></button>
        <button id="divide" value="&divide">&divide</button>
      </div>
      <div class="row">
        <button id="seven" value="7" class="num-btn">7</button>
        <button id="eight" value="8" class="num-btn">8</button>
        <button id="nine" value="9" class="num-btn">9</button>
        <button id="multiply" value="&times">&times</button>
      </div>
      <div class="row">
        <button id="four" value="4" class="num-btn">4</button>
        <button id="five" value="5" class="num-btn">5</button>
        <button id="six" value="6" class="num-btn">6</button>
        <button id="subtract" value="-">-</button>
      </div>
      <div class="row">
        <button id="three" value="3" class="num-btn">3</button>
        <button id="two" value="2" class="num-btn">2</button>
        <button id="one" value="1" class="num-btn">1</button>
        <button id="add" value="+">+</button>
      </div>
      <div class="row">
        <button id="decimal" value=".">.</button>
        <button id="zero" value="0" class="num-btn">0</button>
        <button id="equals">=</button>
      </div>
    </div>
  </div>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
