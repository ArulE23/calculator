<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css"/>
  <title>Calculator</title>
</head>
<body>
  <div id="main-container">
    <div id="display"></div>
    <div id="buttons">
      <div class="row">
        <div id="ac">AC</div>
        <div id="del">DEL</div>
        <div style="visibility: hidden;"></div>
        <div id="divide">&divide</div>
      </div>
      <div class="row">
        <div id="seven">7</div>
        <div id="eight">8</div>
        <div id="nine">9</div>
        <div id="multiply">&times</div>
      </div>
      <div class="row">
        <div id="four">4</div>
        <div id="five">5</div>
        <div id="six">6</div>
        <div id="subtract">-</div>
      </div>
      <div class="row">
        <div id="three">3</div>
        <div id="two">2</div>
        <div id="one">1</div>
        <div id="add">+</div>
      </div>
      <div class="row">
        <div id="decimal">.</div>
        <div id="zero">0</div>
        <div id="equals">=</div>
      </div>
    </div>
  </div>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
