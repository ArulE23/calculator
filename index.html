<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./styles.css"/>
  <title>Calculator</title>
</head>
<body>
  <div id="main-container">
    <div id="display"></div>
    <div id="buttons">
      <div class="row">
        <div id="ac"></div>
        <div id="del"></div>
        <div style="visibility: hidden;"></div>
        <div id="divide"></div>
      </div>
      <div class="row">
        <div id="seven"></div>
        <div id="eight"></div>
        <div id="nine"></div>
        <div id="multiply"></div>
      </div>
      <div class="row">
        <div id="four"></div>
        <div id="five"></div>
        <div id="six"></div>
        <div id="subtract"></div>
      </div>
      <div class="row">
        <div id="three"></div>
        <div id="two"></div>
        <div id="one"></div>
        <div id="add"></div>
      </div>
      <div class="row">
        <div id="zero"></div>
        <div id="decimal"></div>
        <div id="equals"></div>
      </div>
    </div>
  </div>
  <script src="./main.ts"></script>
</body>
</html>
